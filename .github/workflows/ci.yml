name: CI Pipeline

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Root Dependencies (React 19 Console)
      run: npm ci

    - name: Run Linter (React 19 + Fastify Microservices)
      run: npm run lint

    - name: Run Frontend Unit Tests
      run: npm run test

    - name: Build Frontend 1 (React 19 Console)
      run: npm run build

  microservices-and-portal:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Install & Test Fastify Microservices (4 REST + 1 WebSocket)
      run: |
        npm --prefix services ci
        npm --prefix services test

    - name: Install & Build Frontend 2 (Vue 3.5 Collaborator Portal)
      run: |
        npm --prefix portal-colaborador ci
        npm --prefix portal-colaborador run build

  # As regras do Firestore sao a fronteira real de seguranca entre empresas.
  # Esta suite roda cenarios de ataque (tomada de empresa, escalonamento de
  # papel, acesso de conta suspensa) contra o emulador.
  firestore-rules:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Use Java 21 (Firestore Emulator)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Install dependencies
      run: npm ci

    - name: Install Firebase CLI
      run: npm install -g firebase-tools@15

    - name: Run Firestore rules tests
      run: npm run test:rules
