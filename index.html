<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Nexus ITAM — Plataforma SaaS de Gestão de Ativos de TI. Controle patrimônio, licenças, auditorias e muito mais." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Nexus ITAM — Gestão Inteligente de Ativos</title>

    <!-- Favicon otimizado -->
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Preconnect para Firebase (reduz latência de autenticação) -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

    <!--
      O cache-buster manual foi removido: a versao ficava fixa em '2.0.1' (o app
      ja estava em 2.2.x), ele desregistrava o service worker e disparava
      window.location.reload(true) — parametro obsoleto e sem efeito.
      O vite-plugin-pwa esta em registerType 'autoUpdate' e ja cuida disso.
    -->
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center">
        O Nexus ITAM precisa de JavaScript habilitado para funcionar.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
