<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Nexus ITAM — Plataforma SaaS de Gestão de Ativos de TI. Controle patrimônio, licenças, auditorias e chamados." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nexus ITAM: gestão de ativos de TI e chamados" />
    <meta property="og:description" content="Plataforma corporativa de gestão de ativos de TI, termos, auditorias e chamados operacionais." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Nexus ITAM: gestão de ativos de TI e chamados" />
    <meta name="twitter:description" content="Plataforma corporativa de gestão de ativos de TI, termos, auditorias e chamados operacionais." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexus ITAM" />
    <meta name="format-detection" content="telephone=no" />

    <title>Nexus ITAM: gestão de ativos de TI e chamados</title>

    <!-- Tipografia corporativa IBM Plex Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />

    <!-- Favicon e Ícones Nativos iOS / PWA -->
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />

    <!-- Preconnect para Firebase (reduz latência de autenticação) -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

    <!--
      O cache-buster manual foi removido: a versao ficava fixa em '2.0.1' (o app
      ja estava em 2.2.x), ele desregistrava o service worker e disparava
      window.location.reload(true) — parametro obsoleto e sem efeito.
      O vite-plugin-pwa esta em registerType 'autoUpdate' e ja cuida disso.
    -->
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center">
        O Nexus ITAM precisa de JavaScript habilitado para funcionar.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
