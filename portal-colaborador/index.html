<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Portal do Colaborador Nexus ITAM: consulte equipamentos sob sua custódia, assine termos CLT e abra chamados de suporte técnico."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nexus ITAM — Portal do Colaborador" />
    <meta
      property="og:description"
      content="Portal do Colaborador Nexus ITAM: consulte equipamentos sob sua custódia, assine termos CLT e abra chamados de suporte técnico."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Nexus ITAM — Portal do Colaborador" />
    <meta
      name="twitter:description"
      content="Portal do Colaborador Nexus ITAM: consulte equipamentos sob sua custódia, assine termos CLT e abra chamados de suporte técnico."
    />

    <title>Nexus ITAM — Portal do Colaborador</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var t = localStorage.getItem('nexus_portal_theme') || 'system';
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="bg-slate-50 dark:bg-[#09090b] text-slate-900 dark:text-[#fafafa] font-sans antialiased selection:bg-brand selection:text-brand-fg"
  >
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
